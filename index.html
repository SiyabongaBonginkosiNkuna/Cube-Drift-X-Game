<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title> Cube Drift X</title>

  <style>
    /* ── Reset ── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: #000; overflow: hidden; font-family: 'Share Tech Mono', monospace; }

    /* Canvas fills the whole window */
    canvas { display: block; position: fixed; inset: 0; }

    /* Overlay sits on top of the canvas for all UI states */
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none; z-index: 10; color: #fff;
    }

    /* Score / Best shown top-left during play */
    .hud-score { position: fixed; top: 22px; left: 24px; color: #cffff0; text-shadow: 0 0 8px #00ffb0; font-size: clamp(13px,2vw,18px); letter-spacing:.1em; }
    .hud-best  { position: fixed; top: 48px; left: 24px; color: #aaddff; text-shadow: 0 0 8px #44aaff; font-size: clamp(13px,2vw,18px); letter-spacing:.1em; }
    .val { font-family:'Orbitron',sans-serif; font-weight:700; font-size:1.1em; color:#fff; }

    /* Start-screen title */
    .title {
      font-family:'Orbitron',sans-serif; font-weight:900;
      font-size: clamp(32px,6vw,72px); letter-spacing:.08em;
      color:#00ffb8; text-shadow: 0 0 20px #00ffb8, 0 0 50px rgba(0,255,180,.4);
      animation: pulse 2.4s ease-in-out infinite; margin-bottom:18px;
    }

    /* Game-over heading */
    .gameover {
      font-family:'Orbitron',sans-serif; font-weight:900;
      font-size: clamp(36px,7vw,88px); letter-spacing:.06em;
      color:#ff3c5a; text-shadow: 0 0 24px #ff3c5a;
      animation: shake .4s ease both; margin-bottom:20px;
    }

    .score-line { font-size: clamp(16px,2.5vw,28px); letter-spacing:.12em; margin:6px 0; color:#ddeeff; }

    /* Blinking "Press ENTER" prompt */
    .sub { margin-top:28px; font-size:clamp(13px,1.8vw,20px); letter-spacing:.15em; color:rgba(255,255,255,.65); animation: blink 1.1s step-end infinite; }
    .controls { margin-top:14px; font-size:clamp(11px,1.4vw,15px); color:rgba(255,255,255,.35); }
    kbd { padding:1px 7px; border:1px solid rgba(255,255,255,.35); border-radius:3px; background:rgba(255,255,255,.08); }

    /* Corner bracket decorations */
    #c-tl,#c-tr,#c-bl,#c-br { position:fixed; width:48px; height:48px; border-color:rgba(0,255,180,.35); border-style:solid; pointer-events:none; z-index:15; }
    #c-tl { top:16px;    left:16px;   border-width:2px 0 0 2px; }
    #c-tr { top:16px;    right:16px;  border-width:2px 2px 0 0; }
    #c-bl { bottom:16px; left:16px;   border-width:0 0 2px 2px; }
    #c-br { bottom:16px; right:16px;  border-width:0 2px 2px 0; }

    /* Speed bar */
    #spd { position:fixed; top:80px; left:24px; width:120px; pointer-events:none; z-index:15; }
    #spd-label { font-size:11px; letter-spacing:.12em; color:rgba(0,255,180,.5); margin-bottom:4px; }
    #spd-track { width:100%; height:4px; background:rgba(255,255,255,.1); border-radius:2px; overflow:hidden; }
    #spd-fill  { height:100%; background:linear-gradient(90deg,#00ffb8,#ff3c5a); transition:width .3s; border-radius:2px; }

    /* CRT scanline effect */
    body::after { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.07) 2px,rgba(0,0,0,.07) 4px); pointer-events:none; z-index:20; }

    /* Animations */
    @keyframes pulse {
      0%,100% { opacity:1;   text-shadow:0 0 20px #00ffb8,0 0 50px rgba(0,255,180,.4); }
      50%      { opacity:.8;  text-shadow:0 0 35px #00ffb8,0 0 80px rgba(0,255,180,.6); }
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes shake {
      0%  {transform:translateX(0)}   20%{transform:translateX(-8px)}
      40% {transform:translateX(8px)} 60%{transform:translateX(-5px)}
      80% {transform:translateX(5px)} 100%{transform:translateX(0)}
    }
  </style>
</head>

<body>
  <canvas id="glCanvas"></canvas>

  <!-- All game UI (start, HUD, game-over) is injected here by JS -->
  <div id="overlay"></div>

  <!-- Corner decorations -->
  <div id="c-tl"></div><div id="c-tr"></div>
  <div id="c-bl"></div><div id="c-br"></div>

  <!-- Speed bar -->
  <div id="spd">
    <div id="spd-label">SPEED</div>
    <div id="spd-track"><div id="spd-fill" style="width:5%"></div></div>
  </div>

  <!-- Load helpers first, then the game -->
  <script src="utils.js"></script>
  <script src="main.js"></script>
</body>
</html>
